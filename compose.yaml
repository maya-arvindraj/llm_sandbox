services:
  api:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      # db:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redisdata: