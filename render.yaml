# render.yaml — Blueprint for FastAPI + Redis on Render
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: commit this file to your repo root, then in the Render
# dashboard choose "New > Blueprint" and point it at the repo.
# Render will read this file and create both resources automatically.

services:
  # ---- FastAPI web service ----
  - type: web
    name: fastapi-app
    runtime: docker            # builds from the Dockerfile below
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                 # 512 MB RAM, 0.1 CPU, spins down after 15 min idle
    region: oregon              # change to e.g. frankfurt / singapore if needed
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fastapi-redis
          property: connectionString
      - key: PORT
        value: 10000            # FastAPI/uvicorn should bind to this port

  # ---- Redis-compatible Key Value store ----
  - type: keyvalue
    name: fastapi-redis
    plan: free                  # 25 MB, in-memory only, 1 per workspace
    region: oregon
    ipAllowList: []              # empty = internal connections only (recommended)
    maxmemoryPolicy: allkeys-lru
